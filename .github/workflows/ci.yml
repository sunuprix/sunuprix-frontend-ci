name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE_NAME: sunuprix-frontend

jobs:
  # Le nom du job (build) est exige par la regle de protection de main.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Lancer les tests
        run: npm test

      - name: Calculer le tag de l'image (SHA court)
        id: vars
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.DOCKERHUB_USERNAME || 'local' }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Connexion a Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire l'image (et la publier apres un push sur main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
            ${{ steps.vars.outputs.image }}:latest

      - name: Resume
        run: echo "Image ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
